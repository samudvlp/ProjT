<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Gestor | Sistema Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#4f46e5', primaryHover: '#4338ca' } } }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- ================= LOGIN SEGURO ================= -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white border border-gray-200 rounded-2xl max-w-sm w-full p-8 shadow-xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-[color:var(--tw-colors-primary)] flex items-center justify-center text-white font-bold text-2xl mx-auto mb-3 shadow-md">
          🔒
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Acesso Restrito</h1>
        <p class="text-sm text-gray-500 mt-1">Gestão de Agenda e Caixa</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="admin@empresa.com" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--tw-colors-primary)]">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Senha</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--tw-colors-primary)]">
        </div>
        <p id="loginError" class="text-sm text-red-600 hidden text-center font-bold bg-red-50 p-2 rounded-lg"></p>
        <button type="submit" class="w-full bg-[color:var(--tw-colors-primary)] hover:bg-[color:var(--tw-colors-primaryHover)] text-white font-bold py-3.5 rounded-xl shadow-lg transition">
          Entrar no Painel
        </button>
      </form>
    </div>
  </div>

  <!-- ================= PAINEL (PROTEGIDO) ================= -->
  <div id="adminDashboard" class="hidden min-h-screen pb-12 flex flex-col">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="font-bold text-lg text-gray-800">Painel Gestor</h1>
        <div class="flex gap-3">
          <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Visão Cliente</a>
          <button onclick="handleLogout()" class="px-4 py-2 rounded-lg text-sm font-bold bg-red-50 hover:bg-red-100 text-red-600 transition">Sair</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl w-full mx-auto px-4 mt-8 space-y-6 flex-1">
      <!-- Financeiro -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
          <p class="text-sm font-bold text-gray-500">A Receber (Agendados)</p>
          <p id="statRevenue" class="text-3xl font-black text-gray-800 mt-2">R$ 0,00</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
          <p class="text-sm font-bold text-gray-500">Total de Clientes</p>
          <p id="statCount" class="text-3xl font-black text-[color:var(--tw-colors-primary)] mt-2">0</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
          <p class="text-sm font-bold text-gray-500">Caixa (Concluídos)</p>
          <p id="statCompleted" class="text-3xl font-black text-emerald-600 mt-2">R$ 0,00</p>
        </div>
      </div>

      <!-- Agenda -->
      <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50">
          <h2 class="font-bold text-xl text-gray-800">Fluxo de Agendamentos</h2>
          <button onclick="fetchAppointments()" class="text-sm font-bold text-[color:var(--tw-colors-primary)] hover:underline">↻ Atualizar</button>
        </div>
        <div id="appointmentsList" class="p-6 space-y-4"></div>
      </div>
    </main>
  </div>

  <script>
    // === CHAVES DO SUPABASE ===
    const SUPABASE_URL = "SUA_URL_AQUI"; 
    const SUPABASE_KEY = "SUA_ANON_KEY_AQUI";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let appointments = [];

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const isLogged = session !== null;
      
      document.getElementById('loginScreen').classList.toggle('hidden', isLogged);
      document.getElementById('adminDashboard').classList.toggle('hidden', !isLogged);
      
      if (isLogged) fetchAppointments();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        const errEl = document.getElementById('loginError');
        errEl.innerText = "Acesso negado. E-mail ou senha inválidos.";
        errEl.classList.remove('hidden');
      } else {
        checkSession();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      checkSession();
    }

    async function fetchAppointments() {
      const { data, error } = await supabaseClient
        .from('appointments')
        .select('*')
        .order('date', { ascending: false })
        .order('time', { ascending: true });

      if (!error) {
        appointments = data;
        renderAdminPanel();
      }
    }

    async function updateStatus(id, newStatus) {
      await supabaseClient.from('appointments').update({ status: newStatus }).eq('id', id);
      fetchAppointments();
    }

    function renderAdminPanel() {
      const list = document.getElementById('appointmentsList');
      const active = appointments.filter(a => a.status !== 'cancelado');
      const completed = appointments.filter(a => a.status === 'concluido');

      document.getElementById('statRevenue').innerText = `R$ ${active.reduce((sum, a) => sum + Number(a.price), 0).toFixed(2).replace('.', ',')}`;
      document.getElementById('statCount').innerText = active.length;
      document.getElementById('statCompleted').innerText = `R$ ${completed.reduce((sum, a) => sum + Number(a.price), 0).toFixed(2).replace('.', ',')}`;

      if (appointments.length === 0) {
        list.innerHTML = `<p class="text-gray-500 text-center py-4 font-medium">Nenhum agendamento registrado.</p>`;
        return;
      }

      list.innerHTML = appointments.map(a => `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-5 rounded-xl border ${a.status === 'concluido' ? 'bg-emerald-50 border-emerald-100' : a.status === 'cancelado' ? 'bg-red-50 border-red-100' : 'bg-white border-gray-200 shadow-sm'}">
          <div>
            <div class="flex items-center gap-3 mb-2">
              <span class="px-3 py-1 bg-gray-900 text-white font-bold text-xs rounded-lg">${a.time}</span>
              <h4 class="font-bold text-gray-900 text-lg">${a.client_name}</h4>
              <span class="text-xs font-bold uppercase px-2 py-1 rounded-md ${a.status === 'concluido' ? 'text-emerald-700 bg-emerald-100' : a.status === 'cancelado' ? 'text-red-700 bg-red-100' : 'text-amber-700 bg-amber-100'}">${a.status}</span>
            </div>
            <p class="text-sm text-gray-600"><strong>Data:</strong> ${a.date.split('-').reverse().join('/')} • <strong>Serviço:</strong> ${a.service} • <strong>Prof:</strong> ${a.barber} • <strong class="text-gray-900">R$ ${a.price}</strong></p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <a href="https://wa.me/55${(a.phone || '').replace(/\D/g, '')}" target="_blank" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-bold transition">WhatsApp</a>
            ${a.status === 'pendente' ? `
              <button onclick="updateStatus(${a.id}, 'concluido')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold shadow-sm transition">Concluir</button>
              <button onclick="updateStatus(${a.id}, 'cancelado')" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-sm font-bold transition">Cancelar</button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    checkSession();
  </script>
</body>
</html>
